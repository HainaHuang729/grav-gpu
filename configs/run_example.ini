# gravityCU v3.0 Unified Run Configuration Example (INI / TOML-lite)
# Usage:
#   ./build/multi_gpu_slab --config configs/run_example.ini input.bin output.bin 1.0
#   ./build/grav_cosmo_hydro --config configs/run_example.ini cosmo_ic.bin out.bin 1.0
# Explicit GRAV_* environment variables always override values in this file.

[domain]
num_gpus = 1
mode = auto           # auto | 1d_slab | 3d_hilbert | 3d_orb
p2p_mode = nvlink     # nvlink | all | off

[pm]
grid = 128
dynamic = 1
order = pcs           # cic | tsc | pcs
interlace = 1
grad = ik             # fd4 | ik
asmth = 1.25
rcut = 5.5

[precision]
mode = high           # standard | high
theta = 0.25
mac = 1e-4
tidal_timestep = 1
sync_step = 0

[cosmology]
h0 = 67.36
omega_m = 0.3153
omega_de = 0.6847
w0 = -1.0
wa = 0.0
nu_mass_ev = 0.0      # > 0 enables B1 k-space massive neutrinos
f_r0 = 0.0            # > 0 enables B2 Hu-Sawicki n=1 f(R) gravity

[sidm]
sigma_m = 0.0         # cm^2/g (> 0 enables B2 GPU leaf MC-SIDM)
w0 = 0.0              # km/s velocity-dependent scale (0 = constant)

[fof]
enable = 1
link_ratio = 0.2
min_size = 32

[hydro]
alpha_visc = 1.0
alpha_cond = 0.15
balsara = 1
cfl = 0.25
cooling = 1
cooling_scale = 50.0
sf = 1
sf_overdensity = 50.0

[output]
energy_log = 1
