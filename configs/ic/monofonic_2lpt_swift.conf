# monofonIC (MUSIC2) configuration template for gravityCU
# Outputs SWIFT-convention HDF5 directly compatible with scripts/prepare_input.py
# Usage:
#   mpirun -np 4 monofonIC configs/ic/monofonic_2lpt_swift.conf
#   python3 scripts/prepare_input.py ic_monofonic_256.hdf5 ic_256.bin --softening 0.0029 --cosmo-env ic_256.cosmo.env

[setup]
GridRes         = 256
BoxLength       = 25.0          # Mpc/h (monofonIC converts to Mpc when format = swift)
zstart          = 49.0
LPTorder        = 3             # 2 or 3 (3LPT recommended for high-precision gravityCU P1/P2)
DoBaryons       = no
DoFixing        = no
DoInversion     = no
ParticleLoad    = sc

[cosmology]
ParameterSet    = Planck2018EE+BAO+SN
# Or specify explicit parameters + massive neutrinos (for gravityCU B1):
# Omega_m       = 0.3153
# Omega_b       = 0.0493
# Omega_L       = 0.6847
# H0            = 67.36
# n_s           = 0.9649
# sigma_8       = 0.8111
# m_nu1         = 0.06          # eV (total neutrino mass when testing B1)
ZeroRadiation   = false
transfer        = CLASS

[random]
generator       = PANPHASIA
descriptor      = [Panph1,L10,(800,224,576),S9,CH1564365824,EAGLE_L0100_VOL1]

[execution]
NumThreads      = 16

[output]
format          = swift
filename        = ic_monofonic_256.hdf5
