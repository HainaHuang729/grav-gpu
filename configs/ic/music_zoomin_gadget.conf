# MUSIC (MUSIC1) multi-level Zoom-in configuration template for gravityCU (Track B3)
# Outputs multi-mass Gadget-HDF5 (PartType1 high-res + PartType2 coarse boundary)
# Usage:
#   MUSIC configs/ic/music_zoomin_gadget.conf
#   python3 scripts/prepare_input.py ic_music_zoom.hdf5 ic_zoom.bin \
#     --format music --part-types PartType1,PartType2 \
#     --type-softenings PartType1:0.0005,PartType2:0.008 \
#     --soft-out ic_zoom.soft.bin --cosmo-env ic_zoom.cosmo.env
#   source ic_zoom.cosmo.env && GRAV_SOFT_IN=ic_zoom.soft.bin ./build/multi_gpu_slab ic_zoom.bin out.bin 1.0

[setup]
boxlength       = 50.0          # Mpc/h
zstart          = 99.0
levelmin        = 7             # 128^3 base grid
levelmin_TF     = 7
levelmax        = 10            # 1024^3 equivalent zoom-in region (11/12 for 2048^3/4096^3)
padding         = 8
overlap         = 4
ref_center      = 0.5, 0.5, 0.5
ref_extent      = 0.15, 0.15, 0.15
align_top       = no
baryons         = no
use_2LPT        = yes
use_LLA         = no
periodic_TF     = yes

[cosmology]
Omega_m         = 0.3153
Omega_L         = 0.6847
Omega_b         = 0.0493
H0              = 67.36
sigma_8         = 0.8111
nspec           = 0.9649
transfer        = eisenstein

[random]
seed[7]         = 12345
seed[8]         = 23456
seed[9]         = 34567
seed[10]        = 45678

[output]
format          = gadget2
filename        = ic_music_zoom.hdf5
gadget_lunit    = kpc           # prepare_input.py auto-converts kpc/h -> Mpc
gadget_coarsetype = 2
gadget_use_kpc  = yes
gadget_num_files = 1

[poisson]
fft_fine        = yes
accuracy        = 1e-5
pre_smooth      = 3
post_smooth     = 3
smoother        = gs
laplace_order   = 6
grad_order      = 6
